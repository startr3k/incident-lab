services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocbc_ro
      POSTGRES_PASSWORD: readonlypass
      POSTGRES_DB: settlement
    volumes:
      - ./seed/seed_postgres.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    ports: ["5432:5432"]

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9093
      - --advertise-kafka-addr=PLAINTEXT://localhost:9093
    ports: ["9093:9093", "9644:9644"]

  jenkins-mock:
    image: python:3.12-alpine
    command: ["python", "/mock/mock_jenkins.py"]
    volumes:
      - ./mock:/mock:ro
    ports: ["8085:8085"]

  noc-dashboard:
    image: python:3.12-alpine
    command: ["python", "/mock/noc_dashboard.py"]
    environment:
      - ES_URL=http://elasticsearch:9200
      - JENKINS_URL=http://jenkins-mock:8085
    volumes:
      - ./mock:/mock:ro
    ports: ["8090:8090"]
    depends_on: [elasticsearch, jenkins-mock]
